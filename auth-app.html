<!doctype html>
<html lang="en" data-section="radio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Signing in — Radio</title>
<link rel="stylesheet" href="css/style.css?v=12">
<style>
  .auth-app{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; padding:2rem 1.25rem; text-align:center; }
  .auth-app h1{ font-family:var(--f-display); font-weight:600; font-size:1.5rem; margin:0; }
  .auth-app p{ margin:0; color:var(--ink-soft); max-width:30ch; }
  .auth-app .spin{ width:28px; height:28px; border:3px solid var(--accent-soft); border-top-color:var(--accent); border-radius:50%; animation:sp 0.9s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<main class="auth-app">
  <div class="spin" id="spin"></div>
  <h1 id="msg">Signing in…</h1>
  <p id="sub">This window closes by itself and takes you back to the Radio app.</p>
</main>
<script src="js/firebase-config.js?v=3"></script>
<script type="module">
// Sign-in hand-off for the iPhone Radio app. Google doesn't allow signing in inside an app's
// built-in browser, so the app opens this page in Apple's secure sign-in sheet
// (ASWebAuthenticationSession). Here it signs in on ranjithkb.com as usual, then sends the
// Google sign-in tokens back to the app through com.ranjithkb.radio://auth and the sheet
// closes. Nothing is kept here: the session ends as soon as the tokens are handed over.
const CALLBACK = "com.ranjithkb.radio://auth";
const V = "10.12.2";
const msg = (t, s) => {
  document.getElementById("msg").textContent = t;
  if (s !== undefined) document.getElementById("sub").textContent = s;
  if (t !== "Signing in…") document.getElementById("spin").hidden = true;
};
const back = (params) => { location.replace(`${CALLBACK}#${new URLSearchParams(params)}`); };

try {
  const [{ initializeApp }, A] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
  ]);
  const app = initializeApp(window.FIREBASE_CONFIG, "app-signin");
  const auth = A.getAuth(app);
  await A.setPersistence(auth, A.browserSessionPersistence);
  const provider = new A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  const res = await A.getRedirectResult(auth);
  if (res) {
    const cred = A.GoogleAuthProvider.credentialFromResult(res);
    await A.signOut(auth);
    sessionStorage.removeItem("rkb-app-signin");
    if (cred && (cred.idToken || cred.accessToken)) {
      msg("Signed in", "Going back to the Radio app…");
      back({ id_token: cred.idToken || "", access_token: cred.accessToken || "" });
    } else {
      back({ error: "no-credential" });
    }
  } else if (sessionStorage.getItem("rkb-app-signin")) {
    // came back from Google without signing in
    sessionStorage.removeItem("rkb-app-signin");
    back({ error: "cancelled" });
  } else if (new URLSearchParams(location.search).has("start")) {
    sessionStorage.setItem("rkb-app-signin", "1");
    await A.signInWithRedirect(auth, provider);
  } else {
    msg("Nothing to do here", "This page is only used by the Radio app to sign in.");
  }
} catch (e) {
  sessionStorage.removeItem("rkb-app-signin");
  msg("Couldn't sign in", "Close this window and try again.");
  back({ error: (e && e.code) || "failed" });
}
</script>
</body>
</html>
