name: Build cinema listings

on:
  schedule:
    # Italian time ≈ 06:23, 09:23, 12:23, 15:23, 18:23 (UTC+1 in winter; an hour later in summer)
    - cron: "23 5,8,11,14,17 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/build_cinema.py
      - scripts/cinema_overrides.json
      - .github/workflows/build-cinema.yml

permissions:
  contents: write

concurrency:
  group: cinema
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Last published data (kept if a city fails)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: cinema-data
          path: prev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python3 -u scripts/build_cinema.py --out out --prev prev

      - name: Publish to the cinema-data branch (single commit, history not kept)
        run: |
          cat out/report.txt >> "$GITHUB_STEP_SUMMARY"
          cd out
          git init -q -b cinema-data
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Cinema $(date -u '+%F %H:%M') UTC"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cinema-data
