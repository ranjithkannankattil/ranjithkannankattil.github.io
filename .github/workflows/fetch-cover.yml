name: Fetch book cover (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try the known locations
        run: |
          mkdir -p media-incoming/books
          curl -sSL -m 30 -A 'Mozilla/5.0' 'https://www.saikathambooks.com/image/cache/catalog/Book%20Covers/Vinda%20PAdiloode%20Thirke%20Po%20VEnale-550x550h.jpg' | head -c 300; echo
          for q in Vinda PAdiloode Padiloode; do
            curl -sSL -m 30 -A 'Mozilla/5.0' "https://www.saikatham.com/wp-json/wp/v2/media?search=$q&per_page=20" -o m.json -w "media $q %{http_code} %{content_type}\n"
            python3 - <<'P' >> urls.txt || true
          import json
          try:
              for x in json.load(open('m.json')):
                  print(x.get('source_url',''))
          except Exception as e:
              print('', end='')
          P
          done
          curl -sSL -m 30 -A 'Mozilla/5.0' 'https://www.saikatham.com/?s=Vinda+PAdiloode' -o s.html -w "search %{http_code}\n"
          grep -oiE 'https?://[^"'"'"' )]*vinda[^"'"'"' )]*' s.html >> urls.txt || true
          sort -u urls.txt | grep -i -E 'vinda|padiloode' | head -20 | tee list.txt
          while read -r u; do
            curl -sSL -m 40 -A 'Mozilla/5.0' -o c.bin "$u"
            echo "$u -> $(file -b c.bin | cut -c1-60)"
            if file -b --mime-type c.bin | grep -q '^image/' && [ "$(stat -c%s c.bin)" -gt 3000 ]; then
              cp c.bin media-incoming/books/vinda-padiloode-cover.jpg; echo FOUND; break
            fi
          done < list.txt
      - name: Save it
        run: |
          [ -f media-incoming/books/vinda-padiloode-cover.jpg ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add media-incoming && git commit -qm "Recover the Vinda Padiloode book cover"
          git pull -q --rebase origin main && git push -q origin HEAD:main
