name: Build native Radio app
on:
  push:
    branches: [radio-native]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: "2.4.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.keystore"; echo "RADIO_KEYSTORE_PATH=$RUNNER_TEMP/k.keystore" >> "$GITHUB_ENV"
          else mkdir -p ~/.android; keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Build
        env:
          RADIO_KEYSTORE_PASSWORD: ${{ secrets.RADIO_KEYSTORE_PASSWORD }}
          RADIO_WA_NUMBER: ${{ secrets.RADIO_WA_NUMBER }}
        run: |
          if [ -n "$RADIO_WA_NUMBER" ]; then echo "WhatsApp number secret: set"; else echo "WhatsApp number secret: MISSING"; fi
          gradle --no-daemon :app:assembleWebRelease :app:bundlePlayRelease
          cp app/build/outputs/apk/web/release/app-web-release.apk Radio.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab Radio-Velvet-Play.aab
      - name: Publish as the Radio app release (website download + update banners read it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="radio-app-v${APP_VERSION}"
          {
            echo "Version ${APP_VERSION} · released $(TZ=Europe/Rome date '+%-d %b %Y, %H:%M %Z')"
            echo
            echo "What's new:"
            echo "- A new look: elegant and compact, in velvet, cream and gold, with the new Radio Velvet logo"
            echo "- Search every station in every language from the search button, by typing or by voice"
            echo "- Cast to a TV or speaker (Chromecast, Google TV, Nest) from the player"
            echo "- The car or headphones play button starts your last station, like Spotify"
            echo "- A–Z sorting in every list (Favourites keep your order)"
            echo "- Share a picture card together with a link to the station"
            echo "- Close (✕) appears when paused and fully stops the radio; swiping the app away while paused does the same"
            echo "- Radio Velvet on Android TV"
            echo "- Android Auto: next and previous now move through the list you picked the station from"
            echo "- Short notes about Radio Velvet news can now appear in the app (each shown only a few times)"
            echo "- Dark mode: the Radio Velvet title is readable again"
            echo "- A close button (✕) on the player bar stops the radio and puts the bar away"
            echo "- Station lists refresh every time you open a language; removed stations leave your favourites"
            echo "- Stations that only stream in one country say so, e.g. Hit 96.7: Only plays in the UAE"
            echo "- Dark velvet look when your phone is in dark mode"
            echo "- Spin: a random station from the list you're on (press and hold for anywhere in the world)"
            echo "- Collapse the player bar to one slim row with the arrow"
            echo "- Your listening time and top stations in Info, plus how many hours everyone has listened"
            echo "- New two-row player bar: song and play on top; favourite, sleep, share and previous/next below"
            echo "- Custom sleep timer: any length from 5 minutes to 4 hours"
            echo "- Pin languages so they always stay in the top row, and arrange them in your own order"
            echo "- All languages: station counts, Malayalam and English first, and an Every station list"
            echo "- Share as a picture card, as text with a link to the station, or copy the text and link"
            echo "- A ♥ Favourites filter inside each language"
            echo "- Easy scrolling: ↑ and ↓ buttons jump to the top or bottom of long lists"
            echo "- Stations: Velvet Selection and your recent languages as buttons along the top, plus All languages (press and hold a language to remove it)"
            echo "- A roomier player"
            echo "- Rate stations with stars in the player; ratings are shared with the Radio page on ranjithkb.com"
            echo "- Velvet Selection: hand-picked stations from every language, at the top of the language list (and in Android Auto)"
            echo "- Open the song that's playing straight in Spotify; Share is always on the player (song card, or the station when no song is shown)"
            echo "- Delete your account from Info if you ever want to; privacy policy linked there"
            echo "- The station's name shows with the song that's playing; favourites count in brackets"
            echo "- Updates download and install straight from the app, with a progress bar"
            echo "- Favourites: drag ≡ to reorder, or send a station straight to the top or bottom"
            echo "- Poppins font, a cleaner header, and a player that fits every screen (sleep timer always reachable)"
            echo "- Song and singer shown the right way round on stations like Radio Mango"
            echo "- Radio Velvet: a real Android app now, faster and easier to use, with a new name and icon"
            echo "- Song name, artist and album cover while you listen, and a song card you can share"
            echo "- Sign in with Google to keep favourites on every device and on ranjithkb.com"
            echo "- Stations, Favourites and Info at the bottom of the screen; Android Auto support"
            echo "- Pauses for calls and comes back on afterwards; sleep timer"
            echo
            echo "Install: download Radio.apk on your Android phone, open it, and allow the install. It updates the Radio app you have."
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Radio.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest --title "Radio Velvet ${APP_VERSION}" --notes-file notes.md
          else
            gh release create "$TAG" Radio.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Radio Velvet ${APP_VERSION}" --notes-file notes.md
          fi
      - name: Send to Google Play test tracks (skipped until the PLAY_SERVICE_ACCOUNT secret exists)
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT" ]; then echo "No Play key yet: skipping"; exit 0; fi
          pip install -q google-api-python-client google-auth
          NOTES=$(sed -n '/^What.s new:/,/^$/p' notes.md | sed '1d;/^$/d' | head -6)
          python3 scripts/play_upload.py Radio-Velvet-Play.aab "$APP_VERSION" "$NOTES"
