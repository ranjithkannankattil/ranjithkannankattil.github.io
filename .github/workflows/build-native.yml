name: Build native Radio app
on:
  push:
    branches: [radio-native]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.keystore"; echo "RADIO_KEYSTORE_PATH=$RUNNER_TEMP/k.keystore" >> "$GITHUB_ENV"
          else mkdir -p ~/.android; keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Build
        env:
          RADIO_KEYSTORE_PASSWORD: ${{ secrets.RADIO_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Radio-new.apk
      - name: Publish (separate from the current app's releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="radio-native-v${APP_VERSION}"
          NOTES="New native Radio app ${APP_VERSION} (test build ${GITHUB_RUN_NUMBER}, $(TZ=Europe/Rome date '+%-d %b %Y, %H:%M %Z')). Installs next to the current Radio app."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Radio-new.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" Radio-new.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Radio (new app) ${APP_VERSION}" --notes "$NOTES"
          fi
