name: Build Radio Velvet Dev (test build)
# Test builds of the next update: a separate app ("Radio Velvet Dev", id com.ranjithkb.radio.dev) that
# installs next to the real one. Never a public release, never sent to Google Play. The website and the
# app's update banners only read radio-app-v* releases, so they ignore this.
on:
  push:
    branches: [radio-native-dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION: "2.4.0-dev"
      DEV_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Test key (the same every build, so a new Dev app installs over the last one)
        # A throwaway key only for the separate "Radio Velvet Dev" test app (com.ranjithkb.radio.dev).
        # The real app's key is a private repo secret and is never used here.
        run: mkdir -p ~/.android; cp .github/dev-key/dev-test.keystore ~/.android/debug.keystore
      - name: Build the Dev app
        env:
          RADIO_WA_NUMBER: ${{ secrets.RADIO_WA_NUMBER }}
        run: |
          # a release build (like the real app) so scrolling speed is true to life; signed with a throwaway test key
          gradle --no-daemon :app:assemblePlayRelease
          cp app/build/outputs/apk/play/release/app-play-release.apk Radio-Velvet-Dev.apk
      - name: Screenshots of the screens (light and dark, phone sizes)
        continue-on-error: true
        run: gradle --no-daemon :app:testPlayDebugUnitTest --tests "*ScreensTest*"
      - name: Save screenshots and test results to the velvet-dev-screens branch (readable without downloads)
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r app/build/screens/. /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/results && cp app/build/test-results/testPlayDebugUnitTest/*.xml /tmp/out/results/ 2>/dev/null || true
          cd /tmp/out && git init -q -b velvet-dev-screens && git add -A && git -c user.name=ci -c user.email=ci@ranjithkb.com commit -qm "screens $GITHUB_SHA" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" velvet-dev-screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/screens/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Publish the Dev app (test download, not a release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="velvet-dev"
          printf 'Test build of the next Radio Velvet update (%s). Installs as a separate app, "Radio Velvet Dev". Not for sharing.\n' "$(TZ=Europe/Rome date '+%-d %b %Y, %H:%M')" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Radio-Velvet-Dev.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes-file notes.md
          else
            gh release create "$TAG" Radio-Velvet-Dev.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Radio Velvet Dev (test build)" --notes-file notes.md
          fi
