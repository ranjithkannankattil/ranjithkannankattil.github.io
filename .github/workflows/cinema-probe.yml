name: Cinema probe (temporary)
on:
  push:
    branches: [cinema-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir raw && cd raw
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for h in odeon.ccb arlecchino.popupcinema medica.popupcinema rialto.ccb roma.ccb europa.ccb; do
            sleep 20
            curl -sSL -m 40 -A "$UA" -o "$h.html" -w "%{http_code} %{size_download} $h\n" "https://$h.18tickets.it/" || echo "FAIL $h"
            head -c 80 "$h.html"; echo
          done
          for c in 5445 6748 5431 6528; do curl -sSL -m 40 -A "$UA" -o "mmc-$c.html" -w "%{http_code} mmc $c\n" "https://www.mymovies.it/cinema/milano/$c/"; sleep 2; done
          curl -sSL -m 40 -A "$UA" -o mm-vo-roma.html -w "%{http_code} mmvo-roma\n" https://www.mymovies.it/cinema/roma/versione-originale/
          curl -sSL -m 40 -A "$UA" -o mm-vo-firenze.html -w "%{http_code} mmvo-firenze\n" https://www.mymovies.it/cinema/firenze/versione-originale/
          curl -sSL -m 40 -A "$UA" -o mm-vo-brescia.html -w "%{http_code} mmvo-brescia\n" https://www.mymovies.it/cinema/brescia/versione-originale/
          curl -sSL -m 40 -A "$UA" -o cinebot-prog.html -w "%{http_code} cinebot-prog\n" https://ticket.cinebot.it/alcione/programmazione
          ls -la
      - run: |
          cd raw
          git init -q -b cinema-probe-raw
          git config user.name bot; git config user.email bot@example.com
          git add -A; git commit -qm raw
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cinema-probe-raw
