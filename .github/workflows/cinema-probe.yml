name: Cinema probe (temporary)
on:
  push:
    branches: [main]
    paths: [.github/workflows/cinema-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for h in arlecchino.popupcinema medica.popupcinema odeon.ccb rialto.ccb roma.ccb europa.ccb; do
            sleep 8
            curl -sSL -m 40 -A "$UA" -o "$h.html" -w "$h %{http_code} %{size_download}\n" "https://$h.18tickets.it/" || echo "$h FAIL"
          done | tee status.txt
          curl -sSL -m 40 -A "$UA" -o mm_uci.html "https://www.mymovies.it/cinema/milano/6748/"
          curl -sSL -m 40 -A "$UA" -o mm_colosseo.html "https://www.mymovies.it/cinema/milano/5445/"
          curl -sSL -m 40 -A "$UA" -o mm_roma.html "https://www.mymovies.it/cinema/roma/versione-originale/"
          git init -q -b cinema-debug && git config user.name bot && git config user.email bot@example.com
          git add -A && git commit -qm probe
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cinema-debug
