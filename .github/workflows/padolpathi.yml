name: Padolpathi

# Copies the posts of padolpathi.wordpress.com into scripts/padolpathi.json once a day and
# rebuilds the /padolpathi/ pages, so a new word on WordPress shows up on the site by itself.
on:
  schedule:
    - cron: "17 4 * * *"          # daily, 04:17 UTC
  push:
    branches: [main, padolpathi]   # padolpathi: draft branch, remove before merging
    paths: [scripts/import_padolpathi.py, scripts/build_padolpathi.py, .github/workflows/padolpathi.yml]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: padolpathi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy the posts from WordPress
        run: python3 scripts/import_padolpathi.py
      - name: Build the pages
        run: |
          if [ -f scripts/build_padolpathi.py ]; then python3 scripts/build_padolpathi.py; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/padolpathi.json
          [ -d padolpathi ] && git add -A padolpathi sitemap.xml
          git diff --cached --quiet || { git commit -m "Padolpathi: sync from WordPress"; git pull --rebase; git push; }
