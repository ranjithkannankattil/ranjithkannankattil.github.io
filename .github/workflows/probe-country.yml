name: Probe country stations (one-off)
on:
  push:
    branches: [probe-country]
    paths: [probe/redirects.py, .github/workflows/probe-country.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 probe/redirects.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/redirects.json && git commit -qm "probe result" && git push
