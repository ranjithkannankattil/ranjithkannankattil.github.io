name: R2 connection test
on:
  push:
    branches: [media-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are present
        env:
          A: ${{ secrets.R2_ACCOUNT_ID }}
          K: ${{ secrets.R2_ACCESS_KEY_ID }}
          S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          for v in A K S; do [ -n "${!v}" ] || { echo "missing secret $v"; exit 1; }; done
          echo "all three secrets present"
      - name: Upload test file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo "ranjithkb.com media test $(date -u)" > test.txt
          aws s3 cp test.txt s3://ranjithkb-media/test.txt --content-type text/plain \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 ls s3://ranjithkb-media/ --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
