name: Build news

on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/build_news.py
      - scripts/news_config.py
      - scripts/news_extras.py
      - scripts/news_relevance.py
      - scripts/test_news_relevance.py
      - .github/workflows/build-news.yml

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Last published data (kept if a feed fails)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: news-data
          path: prev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q googlenewsdecoder

      - name: Malayalam font for the briefing epub
        run: |
          mkdir -p scripts/.fonts
          curl -sSfL -o scripts/.fonts/Manjari-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/manjari/Manjari-Regular.ttf || true

      - name: Restore link/summary cache
        uses: actions/cache/restore@v4
        with:
          path: .news-cache
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      - name: Tests
        run: pip install -q pytest && cd scripts && python3 -m pytest -q

      - name: Build
        env:
          # optional: add a free Gemini API key as a repository secret named GEMINI_API_KEY
          # to get short AI summaries and a digest per place; everything else works without it
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 -u scripts/build_news.py --out out --prev prev

      - name: Save link/summary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .news-cache
          key: news-cache-${{ github.run_id }}

      - name: Publish to the news-data branch (single commit, history not kept)
        run: |
          cat out/report.txt >> "$GITHUB_STEP_SUMMARY"
          cd out
          git init -q -b news-data
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "News $(date -u '+%F %H:%M') UTC"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" news-data
