name: Build Radio Android app

on:
  push:
    branches: [radio-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Read version and release notes
        run: |
          echo "RADIO_VERSION=$(jq -r .version release-notes.json)" >> "$GITHUB_ENV"
          echo "RADIO_RELEASED=$(TZ=Europe/Rome date '+%-d %b %Y, %H:%M %Z')" >> "$GITHUB_ENV"

      - name: Install and sync web layer
        run: |
          npm ci
          npx cap sync android

      - name: Restore signing key (optional secrets)
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/radio.keystore"
            echo "RADIO_KEYSTORE_PATH=$RUNNER_TEMP/radio.keystore" >> "$GITHUB_ENV"
            echo "Signing with your own key"
          else
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "No RADIO_KEYSTORE_B64 secret: signing with a debug key"
          fi

      - name: Build APK
        env:
          RADIO_KEYSTORE_PASSWORD: ${{ secrets.RADIO_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Radio.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Radio-android
          path: Radio.apk
          retention-days: 30

      - name: Publish APK to the radio-app-apk branch (direct download link)
        run: |
          mkdir /tmp/apkbranch && cp Radio.apk /tmp/apkbranch/ && cd /tmp/apkbranch
          printf 'Latest Radio APK, build %s (%s).\nDownload: https://github.com/%s/raw/radio-app-apk/Radio.apk\n' \
            "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" > README.md
          git init -q -b radio-app-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Radio APK build $GITHUB_RUN_NUMBER"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" radio-app-apk

      - name: Publish GitHub release (download link, version notes, download counts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="radio-app-v${RADIO_VERSION}"
          {
            echo "Version ${RADIO_VERSION} · released ${RADIO_RELEASED}"
            echo
            echo "What's new:"
            jq -r '.android[] | "- " + .' release-notes.json
            echo
            echo "Install: download Radio.apk on your Android phone, open it, and allow installs from your browser when asked."
          } > notes.md
          cat notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # same version rebuilt: replace the file and refresh the notes/date
            gh release upload "$TAG" Radio.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest \
              --title "Radio app ${RADIO_VERSION}" --notes-file notes.md
          else
            gh release create "$TAG" Radio.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Radio app ${RADIO_VERSION}" --notes-file notes.md
          fi

  ios-compile-check:
    # Compiles the iPhone app (no signing) so Swift mistakes show up here, not in Xcode.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build for the iOS simulator
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          test ${PIPESTATUS[0]} -eq 0
