name: Radio ratings rules tests
# Runs the Firestore rules and data-module tests against the Firebase emulator.
on:
  push:
    branches: [main, radio-ratings]
    paths: [firestore.rules, "scripts/rules-test/**", js/radio-ratings-core.js, .github/workflows/radio-rules-test.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install
        working-directory: scripts/rules-test
        run: npm ci --no-audit --no-fund
      - name: Test under the emulator
        working-directory: scripts/rules-test
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project demo-radio "node --test --test-reporter=tap" 2>&1 | tee out.txt
      - name: Summary as an annotation
        if: always()
        working-directory: scripts/rules-test
        run: |
          node -e '
            const t = require("fs").readFileSync("out.txt", "utf8").split("\n");
            const keep = t.filter((l) => /^\s*(not ok|ok \d)|^# (tests|pass|fail)|error:|expected|actual|Error/.test(l)).slice(0, 250);
            const msg = keep.join("\n").replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            console.log("::notice title=rules tests::" + msg);'
