name: Radio station logos (for Android Auto)

# Every Sunday (and by hand): find logos for stations that don't have one yet, put them on R2
# (media.ranjithkb.com/radio-logos/...) and list them in js/station-logos.json. No Claude involved.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many stations to look up this run"
        default: "6000"

permissions:
  contents: write

concurrency:
  group: station-logos
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Find, check and upload logos
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: python3 scripts/fetch_station_logos.py --limit "${{ github.event.inputs.limit || '3000' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add js/station-logos.json scripts/data/station-logos-tried.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -qm "Radio: station logos for Android Auto ($(date +%F))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
