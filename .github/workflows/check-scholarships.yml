name: Check scholarship pages

# Every morning, compares each official scholarship page with the last copy and
# publishes js/scholarships-status.json, which flags changed pages on the site.
# Gemini then suggests new deadlines for changed pages, and a date is used only if
# it passes the checks in scripts/refresh_scholarships.py. It needs nothing from
# the owner. If the Gemini limit becomes a problem, run this every 3 days instead.
on:
  schedule:
    - cron: "37 3 * * *"
  push:
    branches: [main]
    paths: [scripts/check_scholarships.py]
  workflow_dispatch:
    inputs:
      try:
        description: "Listing id to test with Gemini (changes nothing)"
        required: false

permissions:
  contents: write

concurrency:
  group: scholarship-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the official pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/check_scholarships.py
      - name: Update deadlines with Gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TRY_ID: ${{ inputs.try }}
        run: |
          if [ -n "$TRY_ID" ]; then python3 scripts/refresh_scholarships.py --try "$TRY_ID"
          else python3 scripts/refresh_scholarships.py; fi
      - name: Save today's copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add scripts/scholarship-watch.json scripts/scholarship-report.md js/scholarships-status.json js/scholarships-data.js productivity/scholarships.html
          git diff --cached --quiet && exit 0
          git commit -qm "Scholarship check $(date -u '+%F')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
