name: Update Firebase sign-in helper

# Copies Firebase's sign-in helper pages onto ranjithkb.com (under /__/), so Google
# sign-in on the Radio page works in browsers that block cross-site storage (Safari,
# Chrome's storage partitioning). See firebase.google.com/docs/auth/web/redirect-best-practices
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 1 * *"        # monthly, to pick up Firebase updates
  push:
    branches: [main]
    paths:
      - .github/workflows/firebase-auth-helper.yml

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download helper files
        run: |
          set -e
          SRC=https://ranjithkb-radio.firebaseapp.com
          mkdir -p __/auth/handler __/auth/iframe
          # __/firebase/init.json is kept in the repo by hand (this project has no Firebase Hosting)
          # GitHub Pages only serves pages with an .html extension as HTML, so the two
          # pages live at handler/index.html and iframe/index.html (Pages redirects
          # /__/auth/handler -> /__/auth/handler/ and keeps the query string)
          curl -fsSL "$SRC/__/auth/handler"        -o __/auth/handler/index.html
          curl -fsSL "$SRC/__/auth/iframe"         -o __/auth/iframe/index.html
          curl -fsSL "$SRC/__/auth/handler.js"     -o __/auth/handler.js
          curl -fsSL "$SRC/__/auth/iframe.js"      -o __/auth/iframe.js
          curl -fsSL "$SRC/__/auth/experiments.js" -o __/auth/experiments.js
          # the pages load their scripts relatively; make the paths absolute so they
          # still resolve from /__/auth/handler/ and /__/auth/iframe/
          sed -i -E 's#src="(experiments|handler|iframe)\.js"#src="/__/auth/\1.js"#g' __/auth/handler/index.html __/auth/iframe/index.html
          grep -o 'src="[^"]*"' __/auth/handler/index.html __/auth/iframe/index.html
          ls -la __/auth __/auth/handler __/auth/iframe __/firebase
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add __
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Firebase sign-in helper: update copy"
            git pull --rebase && git push
          fi
