name: Check radio streams

on:
  schedule:
    # India time (IST = UTC+5:30, no daylight saving):
    #   00:45 UTC = 6:15 am IST, just after Akashvani stations come on air
    #   13:35 UTC = 7:05 pm IST, evening programming
    - cron: "45 0 * * *"
    - cron: "35 13 * * *"
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab
  push:                   # also run when the checker itself is changed
    branches: [main]
    paths:
      - scripts/check_streams.py
      - js/collections.js
      - .github/workflows/check-radio-streams.yml

permissions:
  contents: write

concurrency:
  group: radio-streams
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test every stream and look for replacements
        run: python3 scripts/check_streams.py

      - name: Add the report to the run summary
        run: cat scripts/stream-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add js/stations scripts/stream-health.json scripts/stream-report.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Radio: stream check $(TZ=Asia/Kolkata date "+%F %H:%M") IST"
            git pull --rebase
            git push
          fi
