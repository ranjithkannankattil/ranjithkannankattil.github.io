name: Check radio streams

on:
  schedule:
    # 06:15 UTC = 11:45 in India, when Akashvani and community stations are on air
    - cron: "15 6 * * *"
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab
  push:                   # also run when the checker itself is changed
    branches: [main]
    paths:
      - scripts/check_streams.py
      - .github/workflows/check-radio-streams.yml

permissions:
  contents: write

concurrency:
  group: radio-streams
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test every stream and look for replacements
        run: python3 scripts/check_streams.py

      - name: Add the report to the run summary
        run: cat scripts/stream-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add js/stations.js scripts/stream-health.json scripts/stream-report.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Radio: daily stream check $(date -u +%F)"
            git pull --rebase
            git push
          fi
